<h2>Nueva Compra</h2>

<form [formGroup]="form" (ngSubmit)="save()">

<label>Proveedor</label>
<input formControlName="proveedor">

<label>Número de Factura</label>
<input formControlName="numero_factura">

<label>Fecha</label>
<input type="date" formControlName="fecha">

<button type="submit">
Guardar
</button>

</form>
