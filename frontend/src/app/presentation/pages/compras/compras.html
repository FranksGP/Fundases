<h2>Lista de Compras</h2>

<table border="1" *ngIf="compras.length > 0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Proveedor</th>
      <th>Fecha</th>
      <th>Total</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let compra of compras">
      <td>{{ compra.id }}</td>
      <td>{{ compra.proveedor }}</td>
      <td>{{ compra.fecha }}</td>
    </tr>
  </tbody>
</table>

<p *ngIf="compras.length === 0">
  No hay compras registradas.
</p>
