<section class="panel">
  <h2>Editar compra #{{ id }}</h2>
  <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
    <label class="field">Proveedor <input type="number" formControlName="proveedor" /></label>
    <label class="field">Usuario <input type="number" formControlName="usuario" /></label>
    <label class="field">N° factura <input formControlName="numero_factura" /></label>
    <label class="field">Fecha <input type="date" formControlName="fecha" /></label>
    <div><button class="btn btn--primary" [disabled]="form.invalid || isLoading">Guardar cambios</button></div>
  </form>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</section>
