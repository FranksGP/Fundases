<section class="panel">
  <h2>Nueva compra</h2>
  <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
    <label class="field">
      Proveedor
      <select formControlName="proveedor">
        <option [ngValue]="null">Seleccione...</option>
        <option *ngFor="let proveedor of proveedores" [ngValue]="proveedor.id">{{ proveedor.nombre }}</option>
      </select>
    </label>

    <label class="field">
      Usuario
      <select formControlName="usuario">
        <option [ngValue]="null">Seleccione...</option>
        <option *ngFor="let usuario of usuarios" [ngValue]="usuario.id">{{ usuario.username }}</option>
      </select>
    </label>

    <label class="field">
      N° factura
      <input formControlName="numero_factura" />
    </label>

    <label class="field">
      Fecha
      <input type="date" formControlName="fecha" />
    </label>

    <div>
      <button class="btn btn--primary" type="submit" [disabled]="form.invalid || isLoading">Guardar</button>
    </div>
  </form>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</section>
