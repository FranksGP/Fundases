<section class="panel">
  <header class="panel__header">
    <h2>Compras</h2>
    <a class="btn btn--primary" routerLink="/compras/crear">Nueva compra</a>
  </header>

  <p *ngIf="isLoading">Cargando compras...</p>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

  <table *ngIf="!isLoading" class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Proveedor</th>
        <th>Usuario</th>
        <th>Factura</th>
        <th>Fecha</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let compra of compras">
        <td>{{ compra.id }}</td>
        <td>{{ compra.proveedor.nombre }}</td>
        <td>{{ compra.usuario.username }}</td>
        <td>{{ compra.numero_factura }}</td>
        <td>{{ compra.fecha }}</td>
        <td>
          <a [routerLink]="['/compras', compra.id]">Ver</a>
          |
          <a [routerLink]="['/compras/editar', compra.id]">Editar</a>
          |
          <button type="button" (click)="deleteCompra(compra.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
